# Alembic configuration.
#
# NOTE: there is deliberately no `sqlalchemy.url` here. The database URL
# is built at runtime in alembic/env.py from app/config.py (the same
# Settings object the API uses), so database credentials live only in
# `.env` and are never written into a file that gets committed.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Keep revision filenames sortable and readable.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
